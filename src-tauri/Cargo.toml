[package]
name = "ubnd-app"
version = "0.1.0"
description = "Vo ung dung cai dat cua He thong dieu hanh UBND xa Nui Cam"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "ubnd_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ubnd-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Không bật feature `devtools`: bản phát hành không có công cụ nhà phát triển (AGENTS.md luật 5).
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
url = "2"
# `tauri::generate_context!` sinh mã gọi serde_json.
serde_json = "1"
log = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Cập nhật tự động chỉ cho Windows (ADR-0002): Android/iOS cập nhật qua cửa hàng. Bản build thử trên Linux của lập
# trình viên không kéo theo plugin này.
[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
